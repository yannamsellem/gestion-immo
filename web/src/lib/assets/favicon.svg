<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p1-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="p1-facade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Fond squircle sombre avec bordure subtile -->
  <rect width="32" height="32" rx="7" fill="url(#p1-bg)" />
  <rect width="30" height="30" x="1" y="1" rx="6" fill="none" stroke="#334155" stroke-width="0.75" />

  <!-- Toit & pignon dynamique -->
  <path d="M6 13.5 L16 6 L26 13.5 L22.5 16 L16 11 L9.5 16 Z" fill="url(#p1-roof)" />

  <!-- Bâtiment principal (façade gauche) -->
  <path d="M8.5 16.5 L15 12 V25.5 H8.5 Z" fill="url(#p1-facade)" />

  <!-- Bâtiment principal (façade droite contrastée) -->
  <path d="M17 12 L23.5 16.5 V25.5 H17 Z" fill="#38bdf8" fill-opacity="0.9" />

  <!-- Fenêtres / découpes géométriques (rythme locatif) -->
  <rect x="10.5" y="17" width="2.5" height="3" rx="0.5" fill="#f8fafc" fill-opacity="0.95" />
  <rect x="19" y="17" width="2.5" height="3" rx="0.5" fill="#0f172a" fill-opacity="0.8" />
  <rect x="10.5" y="21.5" width="2.5" height="2.5" rx="0.5" fill="#f8fafc" fill-opacity="0.95" />
  <rect x="19" y="21.5" width="2.5" height="2.5" rx="0.5" fill="#0f172a" fill-opacity="0.8" />
</svg>
